const placeDetails={
"林百貨":{history:"林百貨於1932年開幕，是台南近代商業發展的重要地標，也常被稱為「五層樓仔」。建築保留了歷史外觀，修復後成為認識府城歷史與文創商品的熱門景點。",tip:"留意建築外觀、老電梯與頂樓神社遺跡；參觀時也可以觀察新舊建築如何共存。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/原林百貨店.JPG"},
"赤崁樓":{history:"赤崁樓的歷史可追溯至荷蘭統治時期，後來歷經不同政權與用途變化。園區中的碑刻、建築與石龜御碑，呈現台南多層次的歷史記憶。",tip:"不要只看建築，也可以留意園區內不同年代留下的石碑與構件。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/臺南市國定古蹟赤崁樓.jpg"},
"安平古堡":{history:"安平古堡與荷蘭東印度公司在台灣的活動密切相關，是理解台灣早期海上貿易、殖民與安平發展的重要地點。今日遺址結合史蹟、展覽與周邊老街。",tip:"把古堡和安平港、老街一起看，更容易理解這裡為何成為重要的海港聚落。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/安平古堡.JPG"},
"安平樹屋":{history:"安平樹屋原是倉庫空間，長年受到榕樹生長影響，氣根與枝幹逐漸包覆牆體，形成建築與自然交織的特殊景觀。",tip:"觀察樹根如何沿著牆面生長，也請走在指定步道上，避免破壞老建築與植物。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/英商德記洋行倉庫(安平樹屋).JPG"},
"四草綠色隧道":{history:"四草綠色隧道位於台江濕地環境中，水道兩側的紅樹林形成綠色廊道。這裡除了觀光，也能認識潮間帶、濕地生態與沿海環境保育。",tip:"搭船時保持安靜、不要餵食或觸碰野生動物，才能降低對濕地生態的干擾。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/四草＿綠色隧道.jpg"},
"台南孔廟":{history:"台南孔廟建於明鄭時期，是台灣重要的儒學文化地標，長期與教育、祭孔儀典及地方文教發展有關。",tip:"可以留意大成殿、泮池與周邊街區，思考古代教育制度如何影響城市發展。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/臺南孔子廟%20大成殿.jpg"},
"神農街":{history:"神農街保留不少傳統街屋與老巷道樣貌，近年也有店家、工作室進駐，讓歷史街區持續被使用。",tip:"慢慢走、留意門面和街屋細節；這裡也是居民生活空間，拍照時記得尊重住戶。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/神農街%20Shennong%20Street%20Tainan%20City01.jpg"},
"藍晒圖文創園區":{history:"藍晒圖文創園區是舊空間轉型為文創場域的例子，透過藝術裝置、設計品牌與展演活動，讓老城區有新的使用方式。",tip:"除了拍照，也可以看看在地設計商品，了解文化創意如何和地方生活連結。",photo:"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Frontalansicht.JPG/1280px-Frontalansicht.JPG"},
"台江國家公園":{history:"台江國家公園包含潟湖、濕地、紅樹林與沿海聚落，生態環境與漁鹽產業、地方生活密切相連。",tip:"觀察鳥類和濕地時請保持距離、不留下垃圾，並遵守步道及遊憩區規範。",photo:"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/79/10_DSC03388-Taijiang_National_Park.jpg/1280px-10_DSC03388-Taijiang_National_Park.jpg"},
"億載金城":{history:"億載金城又稱二鯤鯓砲台，建於清代，是台灣近代海防與軍事設施的重要遺跡。它反映當時面對海上防衛需求的歷史背景。",tip:"留意城門、砲台與城垣配置，可以從空間設計理解防禦用途。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/台南安平億載金城.jpg"},
"奇美博物館":{history:"奇美博物館位於台南仁德，以藝術、樂器、兵器與自然史等收藏聞名，讓不同領域的知識能透過展覽被大眾接觸。",tip:"參觀前先確認展覽與入館規定，選一個有興趣的主題慢慢看，比匆匆走完更有收穫。",photo:"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/2023%E5%B9%B4%E5%A5%87%E7%BE%8E%E5%8D%9A%E7%89%A9%E9%A4%A8_02.jpg/1280px-2023%E5%B9%B4%E5%A5%87%E7%BE%8E%E5%8D%9A%E7%89%A9%E9%A4%A8_02.jpg"},
"國立臺灣歷史博物館":{history:"國立臺灣歷史博物館透過文物、常設展與特展，呈現台灣社會、生活、族群互動與歷史變遷，適合用不同角度理解台灣。",tip:"看展時試著把展品和自己的日常生活連起來，會更容易理解歷史不是只有年代和人名。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/國立臺灣歷史博物館.jpg"},
"水仙宮市場":{history:"水仙宮市場周邊是府城傳統市場與飲食文化的重要區域，從食材、攤商和熟客互動，可以看見城市日常生活的一面。",tip:"避開尖峰時段擋住通道，購買前先詢問價格，也尊重攤商工作節奏。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/臺南水仙宮市場.jpg"},
"大天后宮":{history:"台南大天后宮是重要的媽祖信仰中心，廟宇建築、祭典與信眾活動都呈現民間信仰在地方社會中的角色。",tip:"入廟前觀察現場規範，避免在祭祀或祈禱時大聲喧嘩，拍攝前也可先確認是否合適。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/臺南大天后宮.JPG"},
"延平郡王祠":{history:"延平郡王祠與鄭成功的歷史記憶及後世祭祀有關，園區反映不同時期對歷史人物的紀念與詮釋。",tip:"閱讀現場說明時，可以想想歷史人物的形象如何隨時代被記憶與呈現。",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/台南延平郡王祠.jpg"}
};
const foodDetails={"台南牛肉湯":"台南牛肉湯常以熱湯快速沖入新鮮牛肉片，搭配薑絲等配料。不同店家的湯頭、肉品和吃法各有特色，也和台南的飲食習慣有關。","擔仔麵":"擔仔麵是台南代表性小吃之一，常見小碗麵、肉燥、蝦等配料，份量精巧，反映台灣小吃多樣而靈活的飲食文化。","蝦捲":"蝦捲常見於安平一帶，將蝦或魚漿等餡料包裹後炸至金黃，外酥內香，是地方海味小吃的代表之一。","棺材板":"棺材板是台南具代表性的創意小吃，常以厚片吐司炸酥後挖空，加入濃稠餡料，名稱來自外型的趣味聯想。","碗粿":"碗粿以米漿蒸製，常搭配肉燥、蛋或其他配料，是台灣常見的傳統米食，各地作法與口味略有差異。"};

function knowledgeFor(q){let t=q[0]+" "+q[1].join(" ");if(t.includes("赤崁樓"))return "赤崁樓的歷史可追溯至荷蘭統治時期，後來歷經不同政權使用與修建，是觀察台南多層歷史的代表地點。";if(t.includes("安平古堡")||t.includes("安平與"))return "安平是台灣早期海上交流的重要區域，港口、城堡與老街串起了台南的海洋歷史。";if(t.includes("林百貨"))return "林百貨在1932年開幕，是台南近代商業發展的重要建築，修復後成為歷史與文創並存的場域。";if(t.includes("四草")||t.includes("紅樹林")||t.includes("台江")||t.includes("濕地"))return "濕地能提供鳥類、魚蝦與其他生物棲地，也能調節水文；旅遊時不餵食、不留下垃圾，就是簡單的保育行動。";if(t.includes("孔廟")||t.includes("孔子")||t.includes("儒學"))return "台南孔廟與儒學教育傳統有深厚關係，常被視為台灣重要的文教歷史地標。";if(t.includes("牛肉湯"))return "台南牛肉湯常以熱湯沖入牛肉片，許多店家會搭配薑絲，展現地方早餐文化的特色。";if(t.includes("擔仔麵"))return "擔仔麵是台南常見代表性小吃，通常份量不大，搭配肉燥與蝦等配料，呈現府城飲食特色。";if(t.includes("蝦捲"))return "蝦捲常見於安平一帶，是台南具代表性的海味小吃之一。";if(t.includes("棺材板"))return "棺材板以炸酥的厚片吐司搭配濃稠餡料，名稱來自外型聯想，是台南創意小吃之一。";if(t.includes("碗粿")||t.includes("米食"))return "碗粿主要以米漿蒸製，搭配肉燥或其他配料，是台灣傳統米食。";if(t.includes("神農街"))return "神農街保留不少老街屋風貌，也有店家與工作室進駐；散步時記得尊重居民生活空間。";if(t.includes("藍晒圖"))return "藍晒圖文創園區呈現舊空間轉型的可能，讓藝術、設計與地方生活在同一個場域交流。";if(t.includes("億載金城"))return "億載金城是清代海防砲台遺跡，能幫助理解當時的軍事防衛與海岸環境。";if(t.includes("奇美博物館"))return "奇美博物館收藏領域多元，包含藝術、樂器、兵器與自然史等主題，適合依興趣規劃參觀。";if(t.includes("媽祖")||t.includes("大天后宮"))return "媽祖信仰在台灣民間文化中很重要，廟宇也是地方祭典、互助與社群生活的一部分。";if(t.includes("市場")||t.includes("水仙宮"))return "傳統市場不只有買賣，也是地方飲食、熟客關係與日常生活記憶的集合。";if(t.includes("永續")||t.includes("保護")||t.includes("不干擾")||t.includes("垃圾"))return "永續旅遊不是不去旅行，而是用較低干擾的方式探索：遵守規範、減少垃圾、尊重居民與自然。";if(q[3]==="美食")return "台南飲食深受地方物產、歷史交流與家庭作法影響，同一道小吃也可能因店家而有不同風味。";if(q[3]==="生態")return "自然景點不只是拍照背景，也是一個生態系；保持距離、不採摘、不餵食，能降低旅遊造成的干擾。";if(q[3]==="文化")return "文化景點除了建築外觀，也包含儀式、故事與居民生活。帶著尊重的態度參觀，能看到更多層次。";return "台南的城市魅力來自歷史建築、地方飲食、信仰、街區與自然環境交織。旅行時多看一眼現場細節，就能發現更多故事。"}
function start(){quiz=[...raw].sort(()=>Math.random()-.5).slice(0,10).map(q=>{let o=q[1].map((x,i)=>({x,c:i==q[2]})).sort(()=>Math.random()-.5);return{question:q[0],options:o,category:q[3],fact:q[4]||knowledgeFor(q),correct:o.find(x=>x.c).x,chosen:"",ok:false}});qi=0;score=0;answersLog=[];runCoinStart=S.coin;qRender();go("quiz")}
function qRender(){let q=quiz[qi];quizBox.innerHTML=`<b>第 ${qi+1}/10 題　｜　本次得分 ${score} 分</b><div class="bar"><i style="width:${qi*10}%"></i></div><h2>${q.question}</h2><div class="answers">${q.options.map((o,i)=>`<button class="ans" onclick="answer(${i},this)">${"ABCD"[i]}. ${o.x}</button>`).join("")}</div>`}
function answer(i,b){let q=quiz[qi];if(q.answered)return;q.answered=true;document.querySelectorAll(".ans").forEach(x=>x.disabled=true);q.chosen=q.options[i].x;q.ok=!!q.options[i].c;if(q.ok){score+=10;S.coin+=20;if(q.category==="歷史")S.hist++;if(q.category==="美食")S.food++;if(q.category==="生態")S.eco++;b.classList.add("ok")}else{b.classList.add("bad");q.options.forEach((o,j)=>{if(o.c)document.querySelectorAll(".ans")[j].classList.add("ok")})}answersLog.push(q);save();let feedback=`<div class="feedback ${q.ok?"good":"retry"}"><h2>${q.ok?"🎉 答對了！":"💡 再記一下！"}</h2><p>${q.ok?"你的答案正確：":"正確答案是："}<b>${escapeHTML(q.correct)}</b></p><div class="factbox"><b>📚 台南小知識</b><br>${escapeHTML(q.fact)}</div><p>分類：${escapeHTML(q.category)}｜本次得分：${score}/100</p><button class="btn" onclick="nextQuestion()">${qi===9?"查看本次冒險統整 →":"下一題 →"}</button></div>`;let holder=document.createElement("div");holder.innerHTML=feedback;quizBox.appendChild(holder)}
function nextQuestion(){qi++;if(qi<10)qRender();else finish()}
function finish(){S.runs++;check();save();let cats=["歷史","景點","美食","生態","文化"];let catHTML=cats.map(cat=>{let total=answersLog.filter(q=>q.category===cat).length;let correct=answersLog.filter(q=>q.category===cat&&q.ok).length;return total?`<div class="summary-cat"><span>${cat}</span><div class="bar"><i style="width:${Math.round(correct/total*100)}%"></i></div><b>${correct}/${total}</b></div>`:""}).join("");let wrong=answersLog.filter(q=>!q.ok);let wrongHTML=wrong.length?wrong.map((q,i)=>`<div class="review-item"><b>❌ ${i+1}. ${escapeHTML(q.question)}</b><p>你的答案：${escapeHTML(q.chosen)}<br>正確答案：<b>${escapeHTML(q.correct)}</b></p><p>💡 ${escapeHTML(q.fact)}</p></div>`).join(""):"<p>太棒了！本次 10 題全對，沒有錯題需要複習。🎉</p>";let factHTML=answersLog.map((q,i)=>`<div class="review-item"><b>${i+1}. ${escapeHTML(q.question)}</b><p>📚 ${escapeHTML(q.fact)}</p></div>`).join("");quizBox.innerHTML=`<div style="text-align:center"><h2>🏮 本次府城冒險統整</h2><div style="font-size:55px">${score>=90?"👑":score>=70?"🏆":"🌟"}</div><h1>${score}/100</h1><p>${score>=90?"你已經是府城知識高手！":score>=70?"表現不錯，繼續探索府城吧！":"每一次答題都是新的發現，再挑戰一次會更熟悉！"}</p></div><div class="summary-grid"><div class="stat">✅ 答對<strong>${score/10}/10</strong></div><div class="stat">📊 正確率<strong>${score}%</strong></div><div class="stat">💰 本次金幣<strong>+${S.coin-runCoinStart}</strong></div></div><h3>📊 各類題目表現</h3>${catHTML||"<p>本次題目類別統計</p>"}<h3>📝 錯題複習</h3>${wrongHTML}<details open><summary><b>📚 本次 10 題小知識總整理</b></summary>${factHTML}</details><div style="text-align:center;margin-top:22px"><button class="btn" onclick="start()">再玩一次 🔁</button></div>`}
function show(t){modalText.innerHTML=t;modal.classList.add("show")}function closeM(){modal.classList.remove("show")}charsRender();placeRender();cardsRender();achRender();if(S.ch!==null){startArea.classList.add("show");chosen.textContent="⭐ 已選擇："+chars[S.ch][0]+"，準備好一起出發了嗎？"}stats();
</script></body></html>
